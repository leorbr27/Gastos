<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Acesso — Gastos</title>
<style>:root{--ink:#172033;--muted:#6b7280;--line:#e7eaf0;--primary:#4f46e5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef2ff,#f7f8fc);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 35px rgba(35,45,75,.1)}h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted);margin:0 0 22px}label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}input{width:100%;height:48px;border:1px solid #d7dbe5;border-radius:13px;padding:0 13px;font-size:16px;margin-bottom:13px}button{width:100%;height:48px;border:0;border-radius:13px;font-size:15px;font-weight:800;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;cursor:pointer}.secondary{margin-top:9px;background:#eef2ff;color:#4338ca}.status{display:none;margin:14px 0;padding:12px;border-radius:12px;background:#fef2f2;color:#b91c1c}.status.show{display:block}.ok{background:#ecfdf5;color:#047857}.small{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}</style></head>
<body><main class="card"><h1>Meus gastos</h1><p class="muted">Entre com sua conta do Neon Auth.</p><div id="status" class="status"></div>
<form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button id="entrar">Entrar</button></form>
<button class="secondary" id="criar" type="button">Criar conta</button><p class="small">Sua sessão é gerenciada pelo Neon Auth.</p></main>
<script type="module">
const API_BASE="https://br-billowing-river-b43fz1vp-api.compute.c-6.us-east-2.aws.neon.tech";const $=id=>document.getElementById(id);let auth;
function status(msg,ok=false){$("status").textContent=msg;$("status").className="status show"+(ok?" ok":"")}
async function init(){try{const cfg=await fetch(API_BASE+"/auth-config").then(r=>r.json());if(!cfg.auth_url)throw new Error("Neon Auth ainda não foi provisionado nesta branch.");const mod=await import("https://esm.sh/@neondatabase/auth");auth=mod.createInternalNeonAuth(cfg.auth_url);const s=await auth.adapter.getSession();if(s?.data?.user)location.href="index.html"}catch(e){status(e.message||"Não foi possível iniciar o login.")}}
$("form").onsubmit=async e=>{e.preventDefault();$("entrar").disabled=true;try{const r=await auth.adapter.signIn.email({email:$("email").value.trim(),password:$("senha").value});if(r?.error)throw new Error(r.error.message||"E-mail ou senha inválidos.");location.href="index.html"}catch(e){status(e.message||"Falha ao entrar.")}finally{$("entrar").disabled=false}};
$("criar").onclick=async()=>{const email=$("email").value.trim(),password=$("senha").value;if(!email||!password){status("Informe e-mail e senha para criar a conta.");return}try{const r=await auth.adapter.signUp.email({email,password,name:email.split("@")[0]});if(r?.error)throw new Error(r.error.message||"Não foi possível criar a conta.");status("Conta criada. Entrando…",true);setTimeout(()=>location.href="index.html",400)}catch(e){status(e.message||"Falha ao criar a conta.")}};
init();
</script></body></html>
