<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Todas as parcelas · Contas</title><style>:root{--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e7eaf0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#73777d 0,#85898f 250px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}.container{max-width:920px;margin:auto;padding:20px 16px 48px}.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 8px 28px rgba(35,45,75,.07)}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0 0 5px;font-size:30px}.muted,.meta{color:var(--muted);font-size:13px}.toolbar,.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input{width:100%;height:48px;border:1px solid #d7dbe5;border-radius:13px;padding:0 13px;font-size:16px}a,button{height:44px;border:0;border-radius:13px;padding:0 15px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.ghost{background:#f3f4f6;color:#374151}.secondary{background:#eef2ff;color:#4338ca}.metric{border-radius:15px;padding:15px;background:#f5f3ff}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:21px;margin-top:3px}.item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px}.item:last-child{border-bottom:0}.desc{font-weight:800}.amount{font-weight:850;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;margin-left:5px}.empty{text-align:center;color:var(--muted);padding:28px 5px}@media(max-width:600px){header{display:block}.toolbar,.summary{grid-template-columns:1fr}.item{grid-template-columns:1fr}.amount{text-align:left}}</style></head><body><div class="container"><section class="card"><header><div><h1>Todas as parcelas</h1><div class="muted">Todos os recebimentos previstos, inclusive parcelas de outros meses.</div></div><a class="ghost" href="./index.html">Voltar</a></header></section><section class="card"><div class="toolbar"><div><label for="mes">Filtrar por mês</label><input id="mes" type="month"></div><div><label>Visualização</label><button class="secondary" id="todos" type="button">Mostrar todos os meses</button></div></div></section><section class="card"><div class="summary"><div class="metric"><small>Parcelas</small><strong id="qtd">0</strong></div><div class="metric"><small>Previsto</small><strong id="previsto">R$ 0,00</strong></div><div class="metric"><small>A receber</small><strong id="pendente">R$ 0,00</strong></div></div></section><section class="card"><div id="lista"><div class="empty">Carregando parcelas...</div></div></section></div><script>
const API_BASE="https://br-billowing-river-b43fz1vp-api.compute.c-6.us-east-2.aws.neon.tech";let authClient=null,all=[],monthOnly=true;
const $=id=>document.getElementById(id),brl=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo"}).format(new Date()),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),fmt=x=>{const d=new Date(String(x||"")+"T00:00:00");return Number.isNaN(d.getTime())?String(x||""):d.toLocaleDateString("pt-BR")};
async function jwt(){if(!authClient){const cfg=await fetch(API_BASE+"/auth-config").then(r=>r.json()),mod=await import("https://esm.sh/@neondatabase/auth");authClient=mod.createInternalNeonAuth(cfg.auth_url)}const s=await authClient.adapter.getSession();if(!s?.data?.user){location.href="auth.html";throw Error("LOGIN_REQUIRED")}return authClient.getJWTToken()}
async function api(path){const r=await fetch(API_BASE+path,{headers:{Authorization:"Bearer "+await jwt()}}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error||"Erro na API");return d}
async function load(){try{const rows=[];let o=0,total=Infinity;while(o<total){const r=await api("/receivables?limit=200&offset="+o);rows.push(...(r.receivables||[]));total=Number(r.total||rows.length);if(!r.receivables?.length)break;o+=r.receivables.length}all=rows;render()}catch(e){$("lista").innerHTML='<div class="empty">'+esc(e.message||"Não foi possível carregar as parcelas.")+"</div>"}}
function render(){const m=$("mes").value,rows=all.filter(x=>!monthOnly||!m||String(x.due_date).slice(0,7)===m),expected=rows.reduce((s,x)=>s+Number(x.expected_amount||0),0),received=rows.reduce((s,x)=>s+Number(x.received_amount||0),0);$("qtd").textContent=rows.length;$("previsto").textContent=brl(expected);$("pendente").textContent=brl(Math.max(0,expected-received));$("lista").innerHTML=rows.length?rows.map(x=>{const p=Math.max(0,Number(x.expected_amount)-Number(x.received_amount||0)),st=p<=0?"Recebido":Number(x.received_amount)>0?"Parcial":String(x.due_date)<today()?"Atrasado":"Pendente",parcel=x.installment_total>1?"Parcela "+x.installment_number+"/"+x.installment_total:"Parcela única";return '<div class="item"><div><div class="desc">'+esc(x.description)+' <span class="badge">'+st+"</span></div><div class="meta">"+fmt(x.due_date)+" · "+esc(x.category||"Outros")+" · "+parcel+(x.account_name?" · destino: "+esc(x.account_name):"")+"</div><div class="meta">Recebido: "+brl(x.received_amount)+" · A receber: "+brl(p)+" · registros: "+Number(x.receipt_count||0)+"</div></div><strong class="amount">'+brl(x.expected_amount)+"</strong></div>"}).join(""):'<div class="empty">Nenhuma parcela encontrada.</div>'}
$("mes").value=today().slice(0,7);$("mes").onchange=()=>{monthOnly=true;render()};$("todos").onclick=()=>{monthOnly=false;$("mes").value="";render()};load();
</script></body></html>
